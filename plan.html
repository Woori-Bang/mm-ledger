<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>밍밍 고정지출 정리</title>
<style>
:root { --bg: #f7f6f3; --panel: #fff; --fg: #1f1e1c; --muted: #6b6862; --line: #e4e1da; --accent: #2f6fb0; --err: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg: #1b1a18; --panel: #24231f; --fg: #ece9e3; --muted: #a09c94; --line: #3a3833; --accent: #7fb0e6; --err: #f2b8b5; } }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Noto Sans KR", 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
main { min-height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 12px; }
h1 { margin: 0; font-size: 1.2rem; }
p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }
input { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
label { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .85rem; }
.err { color: var(--err); min-height: 1.2em; }
</style></head>
<body><main>
<form id="f" autocomplete="off">
  <h1>밍밍 고정지출 정리</h1>
  <p>비밀번호를 넣으면 장부가 열려요.</p>
  <input id="pw" type="password" placeholder="비밀번호" aria-label="비밀번호" autofocus>
  <label><input id="keep" type="checkbox"> 이 기기에서 기억하기</label>
  <button type="submit">열기</button>
  <p class="err" id="err" role="alert"></p>
</form>
</main>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function open(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.c));
  const html = new TextDecoder().decode(buf);
  try { sessionStorage.setItem('mm-pw-s', pw); } catch (e) {}
  document.open(); document.write(html); document.close();
}
const err = document.getElementById('err');
let saved = null;
try { saved = localStorage.getItem('mm-pw') || sessionStorage.getItem('mm-pw-s'); } catch (e) {}
if (saved) open(saved).catch(() => { try { localStorage.removeItem('mm-pw'); sessionStorage.removeItem('mm-pw-s'); } catch (e) {} });
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value.trim();
  err.textContent = '여는 중…';
  try {
    if (document.getElementById('keep').checked) { try { localStorage.setItem('mm-pw', pw); } catch (x) {} }
    await open(pw);
  } catch (x) {
    try { localStorage.removeItem('mm-pw'); } catch (y) {}
    err.textContent = '비밀번호가 맞지 않아요.';
  }
});
